<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Яблочный — админ</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <main class="wrap">

    <section id="login" class="card login">
      <b class="brand">ЯБЛОЧНЫЙ</b>
      <h1>Вход для сотрудников</h1>

      <form id="loginForm">
        <label>
          Email
          <input id="email" type="email" required>
        </label>

        <label>
          Пароль
          <input id="password" type="password" required>
        </label>

        <button>Войти</button>
        <p id="loginMsg"></p>
      </form>
    </section>

    <section id="panel" hidden>

      <header>
        <div>
          <b class="brand">ЯБЛОЧНЫЙ</b>
          <h1>Управление товарами</h1>
        </div>

        <button id="logout" class="gray">Выйти</button>
      </header>

      <section class="card">
        <div class="listHead">
          <h2>Категории</h2>
          <button id="refreshCategories" type="button" class="gray">
            Обновить
          </button>
        </div>

        <form id="categoryForm">
          <div class="row">
            <label>
              Название категории
              <input
                id="categoryName"
                placeholder="Например: Автодержатели"
                required
              >
            </label>

            <label>
              Порядок
              <input
                id="categorySort"
                type="number"
                min="0"
                value="0"
              >
            </label>
          </div>

          <label class="check">
            <input id="categoryActive" type="checkbox" checked>
            Показывать категорию
          </label>

          <div class="actions">
            <button type="submit">Добавить категорию</button>
          </div>

          <p id="categoryMsg"></p>
        </form>

        <div id="categoryList"></div>
      </section>

      <div class="grid">

        <form id="productForm" class="card">
          <h2 id="formTitle">Добавить товар</h2>

          <input id="pid" type="hidden">

          <label>
            Название
            <input id="name" required>
          </label>

          <label>
            Категория
            <select id="category"></select>
          </label>

          <div class="row">
            <label>
              Цена ₽
              <input id="price" type="number" min="0" required>
            </label>

            <label>
              Старая цена ₽
              <input id="oldPrice" type="number" min="0">
            </label>
          </div>

          <div class="row">
            <label>
              Остаток
              <input id="stock" type="number" min="0" value="0">
            </label>

            <label>
              Метка
              <input id="badge" placeholder="Новинка">
            </label>
          </div>

          <label>
            Описание
            <textarea id="description" rows="6"></textarea>
          </label>

          <label>
            Фотографии
            <input id="images" type="file" accept="image/*" multiple>
          </label>

          <label class="check">
            <input id="featured" type="checkbox">
            Рекомендуемый
          </label>

          <label class="check">
            <input id="active" type="checkbox" checked>
            Показывать в магазине
          </label>

          <div class="actions">
            <button>Сохранить</button>

            <button
              id="cancel"
              type="button"
              class="gray"
              hidden
            >
              Отмена
            </button>
          </div>

          <p id="formMsg"></p>
        </form>

        <section class="card">
          <div class="listHead">
            <h2>Товары</h2>
            <button id="refresh" class="gray">Обновить</button>
          </div>

          <div id="list"></div>
        </section>

      </div>
    </section>
  </main>

  <script type="module" src="/admin/app.js"></script>
</body>
</html>
